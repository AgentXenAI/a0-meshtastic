# Meshtastic A0 plugin configuration.
# The radio is reached over the Meshtastic TCP API (default port 4403), either
# directly on a node (e.g. a Pi running meshtasticd) or through a Meshmonitor
# proxy that lets multiple clients share one node.

connection:
  # Human label for this node/connection.
  name: "My Node"
  # Radio transport: "tcp" (Meshtastic TCP API on a node or Meshmonitor proxy)
  # or "firefly" (a Firefly UDP virtual node reached over its HTTP API).
  transport: tcp
  # Hostname or IP of the node/proxy exposing the Meshtastic TCP API.
  # Leave empty until set in Config; the bridge will not start without it.
  host: ""
  port: 4403
  # Firefly transport settings (used only when transport is "firefly").
  # Firefly typically runs as a host-side container with network_mode: host;
  # web UI on :5011. Auth is session-cookie login, there is no API token, so the
  # bridge logs in with a real account.
  firefly:
    base_url: ""
    username: ""
    password: ""
    # Profile id from /api/profiles. Empty = auto-select if exactly one exists.
    profile_id: ""
    # How often to poll /api/messages for new inbound traffic.
    poll_seconds: 3

# Inbound chat bridge: mesh DMs -> Agent Zero -> reply back over the mesh.
bridge:
  # Start the listener automatically when Agent Zero boots.
  auto_start: false
  # Node IDs allowed to talk to the agent via DM (e.g. ["!12345678"]).
  # Empty list = allow any sender (rate-limited). Set an allowlist on a live mesh.
  allowed_nodes: []
  # Also treat broadcasts on channel_index as inbound prompts (default off to
  # avoid reacting to general mesh chatter).
  respond_to_broadcasts: false
  channel_index: 0
  # Extra instructions appended to the bridge prompt for this connection.
  instructions: ""
  # Optional default agent profile / model preset for bridge contexts.
  default_agent_profile: ""
  default_preset: ""
  # Per-trust-class profiles: trusted DMs vs public broadcasts.
  dm_agent_profile: ""
  broadcast_agent_profile: ""
  # Read-only tools the public broadcast persona may use besides `response`
  # (e.g. ["search_engine"] for weather / local events). Everything that can
  # touch the host stays blocked regardless. Trusted DMs ignore this.
  broadcast_allowed_tools: ["search_engine", "meshtastic_read", "meshview"]
  # Safety limits. Meshtastic caps a text payload at 200 BYTES; inbound
  # messages already obey that, so this mirrors the protocol limit.
  max_message_length: 200
  rate_limit_max: 3
  rate_limit_window: 120
  # Extra un-@'d words that count as addressing this node. The last 4 hex of
  # self_node_id is ALWAYS accepted without being listed here, because mesh
  # clients show that tail and users type it bare.
  # Only add entries you are sure cannot appear in ordinary conversation - each
  # one can summon a reply out of general channel chatter. The long name is not
  # accepted bare on purpose.
  mention_bare_tokens: []
  # Discord channel id that receives escalation pings (T2 injection / T3 PII).
  # Empty = escalation is logged but never pinged. One ping per node per 24h.
  escalation_discord_channel: ""
  # Conversation starter: Xen opening a thread unprompted. Off by default.
  starter_enabled: false
  starter_idle_hours: 4
  starter_max_per_day: 1
  # Quiet hours in the container's LOCAL time (TZ env). The starter warns
  # loudly if /etc/timezone and the effective local zone disagree.
  starter_quiet_start: "23:00"
  starter_quiet_end: "07:00"
  starter_agent_profile: ""
  # Verified facts the starter may state about this node (hardware, transport).
  # Empty = the starter claims nothing about your deployment. Never put secrets here.
  starter_known_facts: ""
  # This node long name, used for the @mention gate. Empty = node ID only.
  self_long_name: ""

# Outbound sends via the meshtastic_send tool.
send:
  # Allow broadcasts to ^all (spam risk on a live mesh). Off by default.
  allow_broadcast: false
  broadcast_channel: 0
