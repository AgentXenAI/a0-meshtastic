<html>
<head><title>Meshtastic</title></head>
<body>
<div x-data>
  <template x-if="config">
      <div x-data="{ st: null, err: '', busy: false, timer: null,
        async load(){ try { const { callJsonApi } = await import('/js/api.js');
          const r = await callJsonApi('/plugins/meshtastic_a0/meshtastic_bridge_api', {action:'status'});
          if (r && r.ok) { this.st = r; this.err = ''; } else { this.err = (r && r.error) || 'status failed'; }
        } catch (e) { this.err = String(e); } },
        async act(a){ this.busy = true; this.err = ''; try { const { callJsonApi } = await import('/js/api.js');
          const r = await callJsonApi('/plugins/meshtastic_a0/meshtastic_bridge_api', {action:a});
          if (r && r.ok) { await this.load(); } else { this.err = (r && r.error) || (a + ' failed'); }
        } catch (e) { this.err = String(e); } this.busy = false; },
        fmt(ts){ if(!ts) return '-'; try { return new Date(ts).toLocaleString(); } catch(e){ return ts; } } }"
       x-init="
      config.connection = config.connection || {};
      config.bridge = config.bridge || {};
      config.send = config.send || {};
      if (config.connection.name === undefined) config.connection.name = 'Meshtastic';
      if (config.connection.host === undefined) config.connection.host = '';
      if (config.connection.port === undefined) config.connection.port = 4403;
      if (config.connection.transport === undefined) config.connection.transport = 'tcp';
      config.connection.firefly = config.connection.firefly || {};
      ['base_url','username','password','profile_id'].forEach(function(k){
        if (config.connection.firefly[k] === undefined) config.connection.firefly[k] = '';
      });
      if (config.connection.firefly.poll_seconds === undefined) config.connection.firefly.poll_seconds = 3;
      if (config.bridge.auto_start === undefined) config.bridge.auto_start = false;
      if (!Array.isArray(config.bridge.allowed_nodes)) config.bridge.allowed_nodes = [];
      if (config.bridge.respond_to_broadcasts === undefined) config.bridge.respond_to_broadcasts = false;
      if (!Array.isArray(config.bridge.mention_bare_tokens)) config.bridge.mention_bare_tokens = [];
      if (config.bridge.channel_index === undefined) config.bridge.channel_index = 0;
      if (config.bridge.instructions === undefined) config.bridge.instructions = '';
      if (config.bridge.default_agent_profile === undefined) config.bridge.default_agent_profile = '';
      if (config.bridge.dm_agent_profile === undefined) config.bridge.dm_agent_profile = '';
      if (config.bridge.broadcast_agent_profile === undefined) config.bridge.broadcast_agent_profile = '';
      if (!Array.isArray(config.bridge.broadcast_allowed_tools)) config.bridge.broadcast_allowed_tools = ['search_engine'];
      if (config.bridge.rate_limit_max === undefined) config.bridge.rate_limit_max = 3;
      if (config.bridge.rate_limit_window === undefined) config.bridge.rate_limit_window = 120;
      if (config.bridge.escalation_discord_channel === undefined) config.bridge.escalation_discord_channel = '';
      if (config.bridge.starter_enabled === undefined) config.bridge.starter_enabled = false;
      if (config.bridge.starter_idle_hours === undefined) config.bridge.starter_idle_hours = 4;
      if (config.bridge.starter_max_per_day === undefined) config.bridge.starter_max_per_day = 1;
      if (config.bridge.starter_min_interval_minutes === undefined) config.bridge.starter_min_interval_minutes = 240;
      if (config.bridge.starter_max_failures === undefined) config.bridge.starter_max_failures = 3;
      if (config.bridge.starter_quiet_start === undefined) config.bridge.starter_quiet_start = '23:00';
      if (config.bridge.starter_quiet_end === undefined) config.bridge.starter_quiet_end = '07:00';
      if (config.bridge.starter_agent_profile === undefined) config.bridge.starter_agent_profile = '';
      if (config.send.allow_broadcast === undefined) config.send.allow_broadcast = false;
      if (config.send.broadcast_channel === undefined) config.send.broadcast_channel = 0;
      await load();
      timer = setInterval(() => load(), 30000);
      $cleanup(() => clearInterval(timer));
    ">
      <div class="section-title">Meshtastic</div>
      <div class="section-description">Connect to a Meshtastic node over TCP, route inbound mesh DMs into Agent Zero, and send messages back over the mesh.</div>

      <!-- Bridge status + controls.
           Talks to api/meshtastic_bridge_api.py, which existed but had no UI.
           fetchApi is imported dynamically because this fragment is injected
           via x-html and cannot use static ES module imports. -->
      <div class="section-title" style="margin-top:1.2em;">Bridge status</div>
      <div class="section-description">Live state read from the running bridge every 30 s. Restart stops the poll thread and starts it again against the saved config - it picks up config edits, not code edits.</div>

      <div class="field">
        <div class="field-label"><div class="field-title">State</div>
          <div class="field-description">Live bridge state, refreshed every 30 s. Restart re-reads the config below; it does not reload plugin code.</div></div>
        <div class="field-control">
          <span x-show="st && st.bridge.running" style="color:#16a34a;font-weight:600;">&#9679; running</span>
          <span x-show="!st || !st.bridge.running" style="color:#dc2626;font-weight:600;">&#9679; stopped</span>
          <span x-show="st && !st.configured" style="color:#d97706;margin-left:.6em;">not configured</span>
        </div>
      </div>

      <div class="field" x-show="st">
        <div class="field-label"><div class="field-title">Details</div>
          <div class="field-description">Transport, endpoint and when the bridge came up. Firefly password is never returned.</div></div>
        <div class="field-control" style="flex-direction:column;align-items:flex-start;font-size:.85em;line-height:1.6;">
          <div x-show="st"><span x-text="st.connection.transport"></span>
            &middot; <span x-text="st.connection.firefly ? st.connection.firefly.base_url : (st.connection.host + ':' + st.connection.port)"></span></div>
          <div x-show="st">started <span x-text="fmt(st.bridge.started_at)"></span></div>
          <div x-show="st && st.bridge.node">node <span x-text="st.bridge.node"></span></div>
          <div x-show="st && st.bridge.last_error" style="color:#dc2626;">last error: <span x-text="st.bridge.last_error"></span></div>
        </div>
      </div>


      <div class="field">
        <div class="field-label"><div class="field-title">Controls</div>
          <div class="field-description">Restart stops the poll thread and starts it again against the saved config. Use it to pick up config edits without a full restart.</div></div>
        <div class="field-control" style="display:flex;gap:.5em;flex-wrap:wrap;">
          <button class="btn" type="button" :disabled="busy" @click="load()">Refresh</button>
          <button class="btn btn-ok" type="button" :disabled="busy" @click="act('restart')">Restart bridge</button>
          <button class="btn" type="button" :disabled="busy" x-show="st && st.bridge.running" @click="act('stop')">Stop</button>
          <button class="btn" type="button" :disabled="busy" x-show="st && !st.bridge.running" @click="act('start')">Start</button>
        </div>
      </div>

      <div class="field" x-show="err">
        <div class="field-label"><div class="field-title">Status error</div></div>
        <div class="field-control"><span style="color:#dc2626;font-size:.85em;" x-text="err"></span></div>
      </div>

      <div class="field" x-show="st">
        <div class="field-label"><div class="field-title">Last inbound</div>
          <div class="field-description">Most recent mesh traffic the bridge saw, newest last.</div></div>
        <div class="field-control" style="flex-direction:column;align-items:flex-start;font-size:.8em;line-height:1.5;max-height:9em;overflow:auto;">
          <template x-for="(m, i) in (st.recent || [])" :key="i">
            <div><span x-text="fmt(m.ts)"></span> <span x-text="m.name || m.from"></span>: <span x-text="m.text"></span></div>
          </template>
          <div x-show="!st || !(st.recent || []).length">none since bridge start</div>
        </div>
      </div>
      <div class="section-title" style="margin-top:1.2em;">Connection</div>
      <div class="section-description">Where the bridge finds its node. Switching transport hides the fields that do not apply.</div>

      <div class="field">
        <div class="field-label"><div class="field-title">Connection name</div>
          <div class="field-description">Internal label for this node.</div></div>
        <div class="field-control"><input type="text" x-model="config.connection.name" placeholder="My Node" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Transport</div>
          <div class="field-description">"tcp" talks to a node/proxy over the Meshtastic TCP API. "firefly" uses a Firefly UDP virtual node over its HTTP API.</div></div>
        <div class="field-control">
          <select x-model="config.connection.transport">
            <option value="tcp">tcp</option>
            <option value="firefly">firefly</option>
          </select>
        </div>
      </div>

      <div class="field" x-show="config.connection.transport !== 'firefly'">
        <div class="field-label"><div class="field-title">Host</div>
          <div class="field-description">Hostname/IP of the node exposing the Meshtastic TCP API. Leave empty to disable.</div></div>
        <div class="field-control"><input type="text" x-model="config.connection.host" placeholder="node.local" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Port</div>
          <div class="field-description">Meshtastic TCP API port (default 4403).</div></div>
        <div class="field-control"><input type="number" min="1" max="65535" x-model.number="config.connection.port" /></div>
      </div>

      <div class="section-title" x-show="config.connection.transport === 'firefly'">Firefly UDP virtual node</div>
      <div class="section-description" x-show="config.connection.transport === 'firefly'">Firefly runs a Meshtastic virtual node on UDP multicast; this bridge reaches it over its HTTP API. Auth is a session login; there is no API token.</div>

      <div class="field" x-show="config.connection.transport === 'firefly'">
        <div class="field-label"><div class="field-title">Firefly base URL</div>
          <div class="field-description">For example http://192.168.1.20:5011</div></div>
        <div class="field-control"><input type="text" x-model="config.connection.firefly.base_url" placeholder="http://192.168.1.20:5011" /></div>
      </div>

      <div class="field" x-show="config.connection.transport === 'firefly'">
        <div class="field-label"><div class="field-title">Firefly username</div>
          <div class="field-description">Account the bridge logs in as.</div></div>
        <div class="field-control"><input type="text" x-model="config.connection.firefly.username" /></div>
      </div>

      <div class="field" x-show="config.connection.transport === 'firefly'">
        <div class="field-label"><div class="field-title">Firefly password</div>
          <div class="field-description">Stored in plugin config; overridable with FIREFLY_PASSWORD.</div></div>
        <div class="field-control"><input type="password" x-model="config.connection.firefly.password" /></div>
      </div>

      <div class="field" x-show="config.connection.transport === 'firefly'">
        <div class="field-label"><div class="field-title">Profile id</div>
          <div class="field-description">From /api/profiles. Empty auto-selects when exactly one profile exists.</div></div>
        <div class="field-control"><input type="text" x-model="config.connection.firefly.profile_id" /></div>
      </div>

      <div class="field" x-show="config.connection.transport === 'firefly'">
        <div class="field-label"><div class="field-title">Poll interval (seconds)</div>
          <div class="field-description">How often to poll /api/messages for new inbound traffic.</div></div>
        <div class="field-control"><input type="number" min="1" max="120" x-model.number="config.connection.firefly.poll_seconds" /></div>
      </div>

      <div class="section-title" style="margin-top:1.2em;">Broadcasts</div>
      <div class="field">
        <div class="field-label"><div class="field-title">Allow broadcasts</div>
          <div class="field-description">Permit the meshtastic_send tool to broadcast to ^all. Spam risk on a live mesh — keep off unless needed.</div></div>
        <div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.send.allow_broadcast" /><span class="toggler"></span></label></div>
      </div>

      <div class="field" x-show="config.send.allow_broadcast" x-transition>
        <div class="field-label"><div class="field-title">Broadcast channel</div>
          <div class="field-description">Default channel index for broadcasts.</div></div>
        <div class="field-control"><input type="number" min="0" max="7" x-model.number="config.send.broadcast_channel" /></div>
      </div>

      <div class="section-title" style="margin-top:1.2em;">Chat bridge</div>
      <div class="section-description">Mesh DMs are routed into an Agent Zero context and the reply is sent back over the mesh. Inbound text is treated as untrusted.</div>

      <div class="field">
        <div class="field-label"><div class="field-title">Auto-start bridge</div>
          <div class="field-description">Start the listener automatically when Agent Zero boots (requires a host above).</div></div>
        <div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.bridge.auto_start" /><span class="toggler"></span></label></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Allowed node IDs</div>
          <div class="field-description">Comma-separated node IDs allowed to drive the agent (e.g. !12345678). Empty = allow any sender (rate-limited). Set an allowlist on a live mesh.</div></div>
        <div class="field-control"><input type="text" :value="config.bridge.allowed_nodes.join(', ')"
          @input="config.bridge.allowed_nodes = $event.target.value.split(',').map(s => s.trim()).filter(Boolean)"
          placeholder="!12345678" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Respond to broadcasts</div>
          <div class="field-description">Also treat broadcasts on the channel as inbound prompts. Off by default to avoid reacting to general mesh chatter.</div></div>
        <div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.bridge.respond_to_broadcasts" /><span class="toggler"></span></label></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Extra bare mention words</div>
          <div class="field-description">Comma-separated words that address this node WITHOUT an @, matched as whole words. The last 4 hex of the node ID is always accepted and does not need listing. Keep this short - each entry can summon a reply out of ordinary channel chatter. The long name is never accepted bare.</div></div>
        <div class="field-control"><input type="text" :value="config.bridge.mention_bare_tokens.join(', ')"
          @input="config.bridge.mention_bare_tokens = $event.target.value.split(',').map(s => s.trim()).filter(Boolean)"
          placeholder="ab12, mynode" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Channel index</div>
          <div class="field-description">Channel the bridge listens on / replies to.</div></div>
        <div class="field-control"><input type="number" min="0" max="7" x-model.number="config.bridge.channel_index" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Self long name</div>
          <div class="field-description">This node long name, used to build the @mention that gates public replies. Leave empty to match on the node ID only.</div></div>
        <div class="field-control"><input type="text" x-model="config.bridge.self_long_name" placeholder="mynode" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Bridge instructions</div>
          <div class="field-description">Extra persona instructions appended to the bridge prompt.</div></div>
        <div class="field-control" style="width:100%;"><textarea rows="3" style="width:100%;" x-model="config.bridge.instructions"></textarea></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Trusted DM profile</div>
          <div class="field-description">Agent profile used when an allowlisted node sends a DM (the operator). Full tools. Empty falls back to the default profile below. Example: tiny-local</div></div>
        <div class="field-control"><input type="text" x-model="config.bridge.dm_agent_profile" placeholder="tiny-local" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Broadcast profile</div>
          <div class="field-description">Agent profile used for public broadcast traffic. Runs sandboxed (response tool only). Empty falls back to the default profile below. Example: mesh-xen</div></div>
        <div class="field-control"><input type="text" x-model="config.bridge.broadcast_agent_profile" placeholder="mesh-xen" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Default profile (fallback)</div>
          <div class="field-description">Used when the trusted/broadcast profile above is left empty.</div></div>
        <div class="field-control"><input type="text" x-model="config.bridge.default_agent_profile" placeholder="mesh-xen" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Broadcast tools</div>
          <div class="field-description">Comma-separated read-only tools the public broadcast persona may use besides `response` (e.g. search_engine for weather, meshtastic_read for recent mesh messages, meshview for packet propagation). Host-touching tools stay blocked. Trusted DMs ignore this.</div></div>
        <div class="field-control"><input type="text" :value="config.bridge.broadcast_allowed_tools.join(', ')"
          @input="config.bridge.broadcast_allowed_tools = $event.target.value.split(',').map(s => s.trim()).filter(Boolean)"
          placeholder="search_engine, meshtastic_read, meshview" /></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Rate limit</div>
          <div class="field-description">Global max messages within the window (seconds). Enforced at the outbound egress chokepoint, so no caller can bypass it.</div></div>
        <div class="field-control" style="display:flex;gap:0.5em;">
          <input type="number" min="1" x-model.number="config.bridge.rate_limit_max" style="width:6em;" />
          <span>/</span>
          <input type="number" min="1" x-model.number="config.bridge.rate_limit_window" style="width:7em;" />
          <span class="field-description">sec</span>
        </div>
      </div>

      <div class="section-title" style="margin-top:1.2em;">Escalation</div>
      <div class="section-description">Bridge code owns escalation, never the persona. T1 (hostility) and T4 (repeat from a soft-banned node) never ping. T2 (prompt injection) and T3 (PII / attack-surface probing) ping once per node per 24h. Nothing is ever auto-hard-banned.</div>

      <div class="field">
        <div class="field-label"><div class="field-title">Escalation Discord channel</div>
          <div class="field-description">Channel ID that receives T2/T3 pings. Empty = escalation is logged only, never pinged.</div></div>
        <div class="field-control"><input type="text" x-model="config.bridge.escalation_discord_channel" placeholder="123456789012345678" /></div>
      </div>

      <div class="section-title" style="margin-top:1.2em;">Conversation starter</div>
      <div class="section-description">The only path where Xen speaks first. Fires after the idle window, never in quiet hours, capped per day, and the generated text still passes the full outbound egress filter.</div>

      <div class="field" x-show="st">
        <div class="field-label"><div class="field-title">Starter status</div>
          <div class="field-description">Live thread state, refreshed with the bridge status above. Stays visible when the starter is off so you can confirm it really stopped.</div></div>
        <div class="field-control" style="font-size:.85em;line-height:1.5;">
          <div x-show="st"><span x-text="st.bridge.starter.enabled ? 'thread running' : 'off'"></span>
            &middot; sent today <span x-text="st.bridge.starter.sent_today"></span>
            &middot; last skip <span x-text="st.bridge.starter.last_reason || '-'"></span>
            &middot; failures <span x-text="st.bridge.starter.failures"></span></div>
          <div x-show="st && st.bridge.starter.last_fired">last fired <span x-text="fmt(st.bridge.starter.last_fired)"></span></div>
          <div x-show="st && st.bridge.starter.tz_warning" style="color:#d97706;" x-text="st.bridge.starter.tz_warning"></div>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Enable starter</div>
          <div class="field-description">Off by default. When on, Xen opens a thread on the mesh unprompted.</div></div>
        <div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.bridge.starter_enabled" /><span class="toggler"></span></label></div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Starter known facts</div>
          <div class="field-description">Verified facts the starter may state about this node (hardware, transport). Empty = the starter claims nothing about your setup. Never put secrets here.</div></div>
        <div class="field-control" style="width:100%;"><textarea rows="3" style="width:100%;" x-model="config.bridge.starter_known_facts"></textarea></div>
      </div>

      <div class="field" x-show="config.bridge.starter_enabled" x-transition>
        <div class="field-label"><div class="field-title">Idle hours before firing</div>
          <div class="field-description">Hours with no inbound mesh traffic before the starter may fire.</div></div>
        <div class="field-control"><input type="number" min="1" max="72" x-model.number="config.bridge.starter_idle_hours" style="width:6em;" /></div>
      </div>

      <div class="field" x-show="config.bridge.starter_enabled" x-transition>
        <div class="field-label"><div class="field-title">Max per day</div>
          <div class="field-description">Hard cap on starter messages per local day.</div></div>
        <div class="field-control"><input type="number" min="1" max="5" x-model.number="config.bridge.starter_max_per_day" style="width:6em;" /></div>
      </div>

      <div class="field" x-show="config.bridge.starter_enabled" x-transition>
        <div class="field-label"><div class="field-title">Minimum minutes between openers</div>
          <div class="field-description">Hard spacing that applies even if idle and daily gates both say yes. The 2026-10-29 flood shipped six openers five minutes apart; this is the guard that makes that shape impossible.</div></div>
        <div class="field-control"><input type="number" min="0" max="1440" x-model.number="config.bridge.starter_min_interval_minutes" style="width:6em;" /></div>
      </div>

      <div class="field" x-show="config.bridge.starter_enabled" x-transition>
        <div class="field-label"><div class="field-title">Consecutive failures before circuit opens</div>
          <div class="field-description">Dropped or errored attempts that stop the starter until the bridge restarts. Prevents a broken send path from retrying on every tick.</div></div>
        <div class="field-control"><input type="number" min="1" max="10" x-model.number="config.bridge.starter_max_failures" style="width:6em;" /></div>
      </div>

      <div class="field" x-show="config.bridge.starter_enabled" x-transition>
        <div class="field-label"><div class="field-title">Quiet hours (local)</div>
          <div class="field-description">No starter between these times, container local time. The bridge logs a loud warning if /etc/timezone and the effective TZ disagree.</div></div>
        <div class="field-control" style="display:flex;gap:0.5em;">
          <input type="text" x-model="config.bridge.starter_quiet_start" style="width:6em;" placeholder="23:00" />
          <span class="field-description">to</span>
          <input type="text" x-model="config.bridge.starter_quiet_end" style="width:6em;" placeholder="07:00" />
        </div>
      </div>

      <div class="field" x-show="config.bridge.starter_enabled" x-transition>
        <div class="field-label"><div class="field-title">Starter profile</div>
          <div class="field-description">Agent profile used to generate the opener. Empty falls back to the default profile.</div></div>
        <div class="field-control"><input type="text" x-model="config.bridge.starter_agent_profile" placeholder="mesh-xen" /></div>
      </div>

    </div>
  </template>
</div>
</body>
</html>
